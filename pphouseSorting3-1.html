<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter House Sorting Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', serif;
            background: linear-gradient(#023C41, #023C41, #011B22);
            min-height: 100vh;
            color: #f4f4f4;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #c9c9c9;
            font-style: italic;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #d4af37;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .photo-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #d4af37;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .photo-card .card-image {
            width: 100%;
            height: 160px;
            /* adjust to fit */
            border-radius: 12px;
            margin-bottom: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .photo-card .card-text {
            font-weight: 600;
            font-size: 1rem;
        }

        .visual-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 10px;
        }

        .visual-options .option {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .visual-options {
                grid-template-columns: repeat(4, 1fr);
            }

            .photo-card .card-image {
                width: 80px;
                height: 80px;
            }

            .photo-card .card-text {
                font-size: 0.9rem;
            }

            .title {
                font-size: 2rem;
            }

            .quiz-card {
                padding: 25px;
            }

            .question {
                font-size: 1.2rem;
            }

            .option {
                padding: 15px;
                font-size: 1rem;
            }
        }

        .progress {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #d4af37, #f4e99b);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .result-card {
            text-align: center;
            display: none;
        }

        .house-crest {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .gryffindor {
            background: linear-gradient(135deg, #740001, #ae0001);
        }

        .hufflepuff {
            background: linear-gradient(135deg, #ecb939, #f0c75e);
        }

        .ravenclaw {
            background: linear-gradient(135deg, #0e1a40, #222f5b);
        }

        .slytherin {
            background: linear-gradient(135deg, #1a472a, #2a623d);
        }

        .house-name {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .house-description {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }


        .restart-btn,
        .home-btn {
            padding: 14px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        
        .restart-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .home-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        
        .restart-btn:hover,
        .home-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>

        // Create twinkling stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        createStars();

        // Shuffle helper
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];

        // ✅ Function to build quiz questions (always includes 1 visual + 14 others)
        function buildQuizQuestions() {
            const visualQuestions = questions.filter(q => q.visual);
            const nonVisual = questions.filter(q => !q.visual);

            // Shuffle both pools
            const shuffledVisual = shuffleArray(visualQuestions);
            const shuffledNonVisual = shuffleArray(nonVisual);

            const totalQuestions = 15;
            let selectedQuestions = [];

            // Always pick 1 visual first
            if (shuffledVisual.length > 0) {
                selectedQuestions.push(shuffledVisual.pop());
            }

            // Fill the rest randomly from all questions
            const remainingPool = shuffleArray([...shuffledVisual, ...shuffledNonVisual]);

            selectedQuestions.push(...remainingPool.slice(0, totalQuestions - selectedQuestions.length));

            // Final shuffle so the first visual isn't always first
            return shuffleArray(selectedQuestions);
        }



        // Initialize questions
        allQuestions = buildQuizQuestions();

        function displayQuestion(question) {
            const questionEl = document.getElementById('question');
            const optionsEl = document.getElementById('options');
            questionEl.innerHTML = '';
            optionsEl.innerHTML = '';

            // Apply correct layout class
            if (question.visual) {
                optionsEl.className = 'options visual-options';
            } else {
                optionsEl.className = 'options';
            }

            // Display question text
            questionEl.textContent = question.question;

            // Shuffle options
            const shuffledOptions = shuffleArray(question.options.slice());

            shuffledOptions.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                if (question.visual && option.image) {
                    optionDiv.className = 'photo-card'; // 👈 make option itself the card
                    optionDiv.innerHTML = `
        <div class="card-image" style="background-image:url('${option.image}')"></div>
        <div class="card-text">${option.text}</div>
    `;
                } else {
                    optionDiv.textContent = option.text;
                }


                optionDiv.onclick = () => handleAnswer(option);
                optionsEl.appendChild(optionDiv);
            });

            // Update progress
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = ((currentIndex) / allQuestions.length * 100) + '%';
        }

        function handleAnswer(option) {
            houseScores[option.house]++;

            if (option.branchQuestions && option.branchQuestions.length > 0) {
                allQuestions.splice(currentIndex + 1, 0, ...option.branchQuestions);
            }

            currentIndex++;
            if (currentIndex >= allQuestions.length) {
                showResults();
            } else {
                displayQuestion(allQuestions[currentIndex]);
            }
        }

        function showResults() {
            document.getElementById('main-quiz-card').style.display = 'none';
            const resultContainer = document.getElementById('result-container');
            resultContainer.style.display = 'block';

            let maxHouse = Object.keys(houseScores).reduce((a, b) => houseScores[a] > houseScores[b] ? a : b);
            const houseCrest = document.getElementById('house-crest');
            const houseName = document.getElementById('house-name');
            const houseDescription = document.getElementById('house-description');

            const houseImages = {
                gryffindor: "https://i.pinimg.com/736x/a4/14/3a/a4143a7509b8b4de5aa37d694078742c.jpg",
                slytherin: "https://i.pinimg.com/736x/0c/a5/65/0ca565b357b034bb8adc4302d02e1f24.jpg",
                hufflepuff: "https://i.pinimg.com/736x/40/89/fc/4089fcac935b9fd61d34018929a8440f.jpg",
                ravenclaw: "https://i.pinimg.com/1200x/be/6f/b4/be6fb43c13896d8b0b20a29ce9e7f66f.jpg"
            };

            houseCrest.src = houseImages[maxHouse];
            houseCrest.alt = `${maxHouse} crest`;

            houseName.textContent = maxHouse.charAt(0).toUpperCase() + maxHouse.slice(1);
            houseDescription.textContent = `Congratulations! You belong to ${maxHouse} house.`;
        }



        function restartQuiz() {
            houseScores = { gryffindor: 0, slytherin: 0, hufflepuff: 0, ravenclaw: 0 };
            currentIndex = 0;

            // ✅ Rebuild with at least 1 visual
            allQuestions = buildQuizQuestions();

            document.getElementById('result-container').style.display = 'none';
            document.getElementById('main-quiz-card').style.display = 'block';
            displayQuestion(allQuestions[currentIndex]);
        }

        // Start the quiz
        displayQuestion(allQuestions[currentIndex]);
